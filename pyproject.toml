[project]
name = "agentbridge"
version = "0.1.0"
description = "Author an agentic workflow once; run it on Claude Code and LangGraph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
langgraph = [
    "langgraph>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
]

[project.scripts]
agentbridge = "agentbridge.cli:main"

[project.entry-points."agentbridge.backends"]
claude-code = "agentbridge.backends.claude_code:ClaudeCodeBackend"
langgraph = "agentbridge.backends.langgraph:LangGraphBackend"

[project.entry-points."agentbridge.deploy"]
langgraph-platform = "agentbridge.deploy.langgraph_platform:LangGraphPlatformTarget"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/agentbridge"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_core.*", "langchain_anthropic.*"]
ignore_missing_imports = true
